name: Bootstrap MatDash UI v0.2.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand repository source
        shell: bash
        run: |
          set -euo pipefail

          CHUNK_DIR=".bootstrap/chunks"
          if [ ! -d "$CHUNK_DIR" ]; then
            echo "Bootstrap chunks are no longer present; nothing to do."
            exit 0
          fi

          ARCHIVE="$(mktemp --suffix=.tar.gz)"
          cat "$CHUNK_DIR"/part-* > "$ARCHIVE"

          TMP_DIR="$(mktemp -d)"
          tar -xzf "$ARCHIVE" -C "$TMP_DIR"
          cp -a "$TMP_DIR/matdash-ui-v0.2.0-github-ready/." .

          rm -rf .bootstrap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: import MatDash UI v0.2.0 source"
          git push
